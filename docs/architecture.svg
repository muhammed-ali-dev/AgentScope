  <title id="title">AgentScope architecture</title>
  <desc id="desc">Demo agent to Python SDK and CLI, FastAPI telemetry API, PostgreSQL, Next.js dashboard, replay and diff, and evaluation harness.</desc>
  <rect width="1200" height="300" fill="#f5f5f1"/>
  <style>text{font-family:Arial,sans-serif;fill:#202327} .label{font-size:15px;font-weight:700} .sub{font-size:11px;fill:#777b7c} .line{stroke:#d86e3e;stroke-width:2;fill:none} .box{fill:#fbfbf8;stroke:#deded9;stroke-width:1}</style>
  <text x="52" y="48" font-size="12" letter-spacing="3" fill="#999c9a">AGENTSCOPE / DATA FLOW</text>
  <g class="box"><rect x="48" y="105" width="130" height="76" rx="3"/><rect x="218" y="105" width="140" height="76" rx="3"/><rect x="398" y="105" width="140" height="76" rx="3"/><rect x="578" y="105" width="140" height="76" rx="3"/><rect x="758" y="105" width="150" height="76" rx="3"/><rect x="948" y="105" width="190" height="76" rx="3"/></g>
  <g class="line"><path d="M178 143h40M358 143h40M538 143h40M718 143h40M908 143h40"/><path d="m210 137 8 6-8 6M390 137l8 6-8 6M570 137l8 6-8 6M750 137l8 6-8 6M940 137l8 6-8 6"/></g>
