  <text x="288" y="136" text-anchor="middle" class="label">Python SDK / CLI</text><text x="288" y="157" text-anchor="middle" class="sub">trace + replay</text>
  <text x="468" y="136" text-anchor="middle" class="label">FastAPI API</text><text x="468" y="157" text-anchor="middle" class="sub">ingest + query</text>
  <text x="648" y="136" text-anchor="middle" class="label">PostgreSQL</text><text x="648" y="157" text-anchor="middle" class="sub">runs + evaluations</text>
  <text x="833" y="136" text-anchor="middle" class="label">Next.js dashboard</text><text x="833" y="157" text-anchor="middle" class="sub">timeline + cost</text>
